<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Tower Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="index-body">

<!-- Darkened backdrop -->

<div class="auth-backdrop"></div>

<!-- Full-Screen Auth Gate -->
 
  <div id="auth-gate">
    <form id="auth-form">
      <h2 id="auth-title">Create an Account</h2>
      <p>Sign up to watch the live stream and join the conversation.</p>

      <input id="auth-username" type="text" placeholder="Username" required minlength="3">
      <input id="auth-password" type="password" placeholder="Password" required minlength="6">
      
      <button type="submit" id="auth-submit">Create Account</button>

    </form>

    <div id="auth-gate-footer">
      <p id="auth-error" style="display: none;"></p>
      <p>Already have an account?
        <a href="#" id="auth-gate-link">Sign in.</a>
      </p>
    </div>

  </div>

  <header class="navbar">

    <div class="logo">
      <img src="./assets/thetower-live-logo.jpg" alt="The Tower Live Logo">
    </div>

    <div class="nav-links">
      <ul>
        <li><a href="messages.html" class="nav-links-icon"><img src="./assets/email-icon-white.svg" alt="Inbox" id="nav-img"></a></li>
        <li><a href="profile.html" class="nav-links-icon"><img src="./assets/profile-icon.svg" alt="Profile" id="nav-img"></a></li>
        <li><a href="settings.html" class="nav-links-icon"><img src="./assets/settings-icon.svg" alt="Settings" id="nav-img"></a></li>
      </ul>
    </div>

  </header>

  <main>
    <section class="main-content">
      <div class="livestream" id="livestream">
        <p>Live stream down :( will be back soon.</p>
      </div>
      <div class="chat" id="chat">
        <p>Chat is not programmed yet. Check back soon :).</p>
      </div>
    </section>

  </main>


  <script src="app.js"></script>
</body>
</html>
